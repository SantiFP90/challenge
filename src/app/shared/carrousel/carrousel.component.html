<p-carousel
  [value]="carouselNews"
  [numVisible]="4"
  [numScroll]="1"
  [circular]="true"
  [autoplayInterval]="4000"
  [responsiveOptions]="carouselResponsiveOptions"
  class="custom-carousel"
>
  <ng-template let-news pTemplate="item">
    <div class="p-2" (click)="viewNewsDetail(news.id)">
      <div class="surface-card shadow-1 p-3 border-round">
        <img
          [style.view-transition-name]="'transition-image-' + news.id"
          [src]="news.imageUrl"
          class="w-full h-10rem object-cover border-round mb-2"
        />
        <p class="text-red text-xs font-semibold mb-1">
          {{ news.location }}
        </p>
        <p class="text-sm text-900 font-medium mb-1 line-clamp-2">
          {{ news.title }}
        </p>
        <p class="text-xs text-500 mb-0">{{ news.author }}</p>
      </div>
    </div>
  </ng-template>
</p-carousel>
