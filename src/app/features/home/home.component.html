<div class="grid p-4 pt-1 m-0 align-items-center bg-gray-50">
  <div class="col-12 lg:col-8">
    <div
      class="surface-card border-round"
      (click)="viewNewsDetail(mainNews.id)"
    >
      <p class="location font-bold font-medium mb-2">{{ mainNews.location }}</p>
      <h2 class="text-3xl font-bold text-900 line-height-3 mb-3">
        {{ mainNews.title }}
      </h2>
      <img
        [src]="mainNews.imageUrl"
        alt="Imagen Principal"
        class="w-10 mb-3 border-round"
      />
      <p class="text-sm text-500 mb-2">
        {{ mainNews.author }} - {{ mainNews.createdAt | date : "short" }}
      </p>
      <p class="text-700">{{ mainNews.content }}</p>
    </div>
  </div>

  <div class="col-12 lg:col-4">
    <div
      *ngFor="let news of sideNews"
      class="mb-3 p-3 shadow-1 border-round-md flex align-items-center gap-3 sub-cards cursor-pointer"
      (click)="viewNewsDetail(news.id)"
    >
      <img
        src="{{ news.imageUrl }}"
        alt="Miniatura"
        class="w-6rem h-4rem object-cover border-round"
      />
      <div>
        <p class="location font-bold text-xs mb-1">{{ news.location }}</p>
        <p class="font-semibold text-sm text-900 mb-0">{{ news.title }}</p>
        <p class="text-500 text-xs mb-0">{{ news.author }}</p>
      </div>
    </div>
  </div>

  <div class="col-12 mt-5">
    <p-carousel
      [value]="carouselNews"
      [numVisible]="4"
      [numScroll]="1"
      [circular]="true"
      [autoplayInterval]="4000"
      [responsiveOptions]="carouselResponsiveOptions"
      class="custom-carousel"
    >
      <ng-template let-news pTemplate="item">
        <div class="p-2" (click)="viewNewsDetail(news.id)">
          <div class="surface-card shadow-1 p-3 border-round">
            <img
              [src]="news.imageUrl"
              class="w-full h-10rem object-cover border-round mb-2"
            />
            <p class="location text-xs font-semibold mb-1">
              {{ news.location }}
            </p>
            <p class="text-sm text-900 font-medium mb-1 line-clamp-2">
              {{ news.title }}
            </p>
            <p class="text-xs text-500 mb-0">{{ news.author }}</p>
          </div>
        </div>
      </ng-template>
    </p-carousel>
  </div>
</div>
