<div
  class="header flex flex-row justify-content-between align-items-center p-3"
>
  <div>
    <H1 class="m-0 p-0">MFunny'S News</H1>
  </div>
  <div class="flex gap-2">
    @if( isDetailsRoute) {
    <button
      class="btn-new only-component"
      pButton
      icon="pi pi-trash"
      label="Eliminar noticia"
      (click)="deleteNews()"
    ></button>
    }
    <button
      class="btn-new only-component"
      pButton
      [icon]="isDetailsRoute ? 'pi pi-pencil' : 'pi pi-plus'"
      [label]="isDetailsRoute ? 'Editar noticia' : 'Nueva noticia'"
      (click)="openModal()"
    ></button>
  </div>
</div>

<app-news-form-modal
  [visible]="visible"
  (modalClosed)="onModalClosed()"
  (newsCreated)="onNewsCreated()"
/>
